# Warning - this will fail for offline installs. The docker role should have installed these packages beforehand
- name: "{{ docker_deploy_stack_name }} : Create stack project directory"
  file:
    name: "{{ docker_deploy_project_dir }}"
    state: directory

- name: "{{ docker_deploy_stack_name }} : Create stack other directories"
  file:
    path: "{{ item.name | default(item) }}"
    owner: "{{ item.owner | default(docker_deploy_dirs_owner) }}"
    group: "{{ item.group | default(docker_deploy_dirs_group) }}"
    mode: "{{ item.mode | default(docker_deploy_dirs_mode) }}"
    state: directory
  loop: "{{ docker_deploy_dirs }}"

- name: "{{ docker_deploy_stack_name }} : Template stack files"
  template:
    src: "{{ item.src | default(item.dest + '.j2') }}"
    dest: "{{ docker_deploy_project_dir }}/{{ item.dest }}"
  loop: "{{ docker_deploy_templates }}"

- import_role:
    name: peshev.docker.docker_images
  vars:
    docker_images: "{{ (lookup('template', docker_deploy_compose_file_name + '.j2') | from_yaml).services.values() | selectattr('image', 'defined') | map(attribute='image') | list }}"
    docker_images_install_offline: "{{ docker_deploy_offline }}"

- block:
    - name: "{{ docker_deploy_stack_name }} : Install docker_stack module dependencies"
      package:
        name:
          - python3-jsondiff
          - python3-yaml
    - name: "{{ docker_deploy_stack_name }} : Deploy swarm secrets"
      community.docker.docker_secret:
        name: "{{ item.key }}"
        data: "{{ item.value }}"
      loop: "{{ docker_deploy_secrets | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
    - name: "{{ docker_deploy_stack_name }} : Deploy as a docker swarm stack"
      community.docker.docker_stack:
        name: "{{ docker_deploy_stack_name }}"
        compose:
          - "{{ docker_deploy_compose_file }}"
  when: docker_deploy_swarm
  run_once: true

- block:
    - name: "{{ docker_deploy_stack_name }} : Create directory for Docker compose secret files"
      file:
        path: "{{ docker_deploy_compose_secrets_dir }}"
        state: directory
    - name: "{{ docker_deploy_stack_name }} : Create Docker compose secret files"
      copy:
        dest: "{{ docker_deploy_compose_secrets_dir }}/{{ item.key }}"
        content: "{{ item.value }}"
      loop: "{{ docker_deploy_secrets | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
    - name: "{{ docker_deploy_stack_name }} : Deploy as a docker compose stack"
      community.docker.docker_compose_v2:
        project_name: "{{ docker_deploy_stack_name }}"
        project_src: "{{ docker_deploy_project_dir }}"
  when: not docker_deploy_swarm