---
driver:
  name: docker
  _dummy:
    platform-systemd: &platform-systemd
      command: /usr/lib/systemd/systemd
      capabilities:
        - SYS_ADMIN
      volumes:
        - /sys/fs/cgroup:/sys/fs/cgroup:rw
      cgroupns_mode: host
    platform-redhat: &platform-redhat
      <<: *platform-systemd
      dockerfile: ../Dockerfile.redhat.j2
      groups:
        - redhat

platforms:
  - name: EL-8
    image: redhat/ubi8
    privileged: true
    <<: *platform-redhat
    buildargs:
      BASE_IMAGE: "redhat/ubi8"
    groups:
      - redhat_baased
      - rhel
