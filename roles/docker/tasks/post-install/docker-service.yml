- name: Get Docker service status
  ansible.builtin.systemd_service:
    name: docker
  register: docker_service_status

- name: Replace Docker service ExecStart command if configured
  ansible.builtin.replace:
    path: "{{ docker_service_status.status['FragmentPath'] }}"
    regexp: "^ExecStart=.*$"
    replace: "ExecStart={{ docker_service_start_command }}"
  when: docker_service_start_command is truthy
  notify:
    - systemctl daemon-reload
    - restart docker

- name: Configure Docker to start on boot with systemd
  service:
    name: "{{ item }}"
    state: "{{ docker_service_state }}"
    enabled: "{{ docker_service_enabled }}"
  loop:
    - docker
    - containerd
  ignore_errors: "{{ ansible_check_mode }}"
  when: docker_service_manage is truthy
