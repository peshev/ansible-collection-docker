# https://docs.docker.com/engine/swarm/swarm-mode
- name: Gather minimal OS facts when they are missing
  ansible.builtin.setup:
    gather_subset:
      - interfaces
  when:
    - docker_swarm_advertise_addr is not defined
  tags: always

- debug:
    msg:
      advertise_addr: "{{ docker_swarm_advertise_addr }}"
      default_addr_pool: "{{ docker_swarm_default_addr_pool }}"
- block:
    - name: Create swarm
      docker_swarm:
        state: present
        advertise_addr: "{{ docker_swarm_advertise_addr }}"
        default_addr_pool: "{{ docker_swarm_default_addr_pool }}"
      register: init_swarm

    - name: View the join command or update a swarm join token
      set_fact:
        join_token_manager: "{{ init_swarm.swarm_facts.JoinTokens.Manager }}"
        join_token_worker: "{{ init_swarm.swarm_facts.JoinTokens.Worker }}"
      when: init_swarm is changed

    - block:
        - name: Getting join manager token from existing Swarm
          command: docker swarm join-token manager -q
          register: join_token_manager_command
          changed_when: false

        - name: "set fact: join_token"
          set_fact:
            join_token_manager: "{{ join_token_manager_command.stdout }}"
      when: join_token_manager is not defined

    - block:
        - name: Getting join worker token from existing Swarm
          command: docker swarm join-token worker -q
          register: join_token_worker_command
          changed_when: false

        - name: "set fact: join_token"
          set_fact:
            join_token_worker: "{{ join_token_worker_command.stdout }}"
      when: join_token_worker is not defined
  when: inventory_hostname == docker_swarm_init_node

- name: Join remaining manager nodes into the swarm
  docker_swarm:
    state: join
    join_token: "{{ hostvars[docker_swarm_init_node].join_token_manager }}"
    advertise_addr: "{{ docker_swarm_advertise_addr }}"
    remote_addrs:
      - "{{ docker_swarm_init_node_advertise_addr }}"
  when: inventory_hostname in docker_swarm_managers[1:]

- name: Join worker nodes into the swarm
  docker_swarm:
    state: join
    join_token: "{{ hostvars[docker_swarm_init_node].join_token_worker }}"
    advertise_addr: "{{ docker_swarm_advertise_addr }}"
    remote_addrs:
      - "{{ docker_swarm_init_node_advertise_addr }}"
  when: inventory_hostname in docker_swarm_workers

- name: Set swarm node labels
  docker_node:
    hostname: "{{ hostvars[item].ansible_hostname }}"
    labels: "{{ hostvars[item].docker_swarm_labels }}"
    labels_state: replace
  loop: "{{ docker_swarm_managers + docker_swarm_workers }}"
  when: inventory_hostname == docker_swarm_init_node and hostvars[item].docker_swarm_labels is defined
