- name: Validate role variables
  assert:
    that:
      - docker_images_transfer_method in ['load', 'push']
      - docker_image_private_registry is truthy or docker_images_transfer_method != 'push'
  tags:
    - always

- name: Normalize docker images
  set_fact:
    docker_images_normalized: "{{ docker_images | map('peshev.docker.normalize_docker_image', default_pull_policy=docker_images_default_pull_policy, default_build=docker_images_default_build) | list }}"
  tags:
    - always

- name: Pull images on target host
  import_tasks: pull.yaml

- name: Prepare offline assets
  import_tasks: prepare.yml
  delegate_to: localhost
  run_once: yes
  tags:
    - prepare-offline

- name: Transfer images to target host
  import_tasks: transfer.yml
  when: docker_images_to_transfer is truthy